name: Build LaTeX

on:
  push:
  pull_request:
  
jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
      
    steps:
      - uses: actions/checkout@v5

      - name: Compile
        continue-on-error: true
        run: make all

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PDFs
          path: latex/*.pdf

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Log
          path: latex/*.log
